name: Build release

# This repository holds a build, not a source tree. The source lives in the
# private repository; this repository exists because a public repository
# builds on GitHub-hosted runners for free, while a private repository
# spends a small monthly pool of build minutes. The desktop artifacts are
# the expensive part -- a macOS artifact can only be built on macOS -- so
# they are built here, on runners that cost the private repository nothing.
#
# The workflow is triggered by a `repository_dispatch`, and that is the
# only trigger. The dispatch comes from the machine that published the
# release (`bun run deploy`): the private repository's own Actions cannot
# run -- the account's build minutes are spent, and a job there would not
# start at all -- so the trigger is not a workflow listening for the tag
# but a call from the publishing machine.
#
# The payload carries the ref to build, which is the tag of the release.
#
# The source is checked out with a read-only token, so what this repository
# publishes is a binary, never a source line. The credentials that can write
# to the release host do not live here -- the artifacts travel back to the
# private repository, which publishes them.
#
# One version is one release. Every builder uploads its part as a workflow
# artifact, and the publish job merges the parts into a single release
# named after the version. A mirror that serves one directory per version
# needs exactly that shape, and the release assets are the download source
# the relay proxies.

on:
  repository_dispatch:
    types: [build-desktop]

# The release is created with the workflow's own token. The source is read
# with a separate, read-only token.
permissions:
  contents: write

jobs:
  # The CLI archives are cross-compiled: Bun emits a target binary from any
  # host, and the two sandbox runners have cross toolchains for the targets
  # they serve. The toolchain is named here because the runner image does
  # not carry it: zig cross-compiles every target, so one compiler covers
  # the Linux arm64 runner and both Windows runners.
  build-cli:
    name: Build the CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xinggaoya/coda
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.CODA_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Verify the requested version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          workspace_version="$(node -p "require('./packages/coding-agent/package.json').version")"
          if [ "$REQUESTED_VERSION" != "$workspace_version" ]; then
            echo "::error::The requested version ($REQUESTED_VERSION) is not the version of the source ($workspace_version)."
            exit 1
          fi
          echo "==> Building the CLI release of $workspace_version"

      - name: Install the cross toolchains
        shell: bash
        run: |
          sudo apt-get update
          if ! command -v zig >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends zig || bun add --global @ziglang/cli
          fi
          zig version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package the CLI release
        run: bun run package:cli -- --all-platforms

      # The part of the release this runner produced: the six platform
      # archives, the install scripts and the checksum manifest.
      - name: Upload the CLI part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli
          path: .artifacts/remote-server/${{ github.event.client_payload.version }}
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Build the desktop release (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not throw away the artifact the other
      # platforms already built: the release is published with what is
      # there, and the failure is visible in the job that failed.
      fail-fast: false
      matrix:
        include:
          - os: linux
            target: linux
            runner: ubuntu-latest
          - os: windows
            target: win
            runner: windows-latest
          - os: macos
            target: mac
            runner: macos-latest
    steps:
      - name: Checkout the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xinggaoya/coda
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.CODA_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Verify the requested version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          workspace_version="$(node -p "require('./packages/coding-agent/package.json').version")"
          if [ "$REQUESTED_VERSION" != "$workspace_version" ]; then
            echo "::error::The requested version ($REQUESTED_VERSION) is not the version of the source ($workspace_version)."
            exit 1
          fi
          echo "==> Building the desktop artifacts of $workspace_version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The desktop app is Electron: a macOS artifact can only be built on
      # macOS and a Windows artifact only on Windows. `package:desktop` runs
      # electron-builder and gives the artifacts the names the release
      # namespace uses.
      - name: Package the desktop app
        run: bun run package:desktop -- --target=${{ matrix.target }}

      # The staging directory holds the files this runner produced, under the
      # names the build gave them, plus the checksum manifest for them.
      #
      # What is filtered here is the file *format*, not the name: the release
      # namespace carries a desktop artifact as an AppImage, a zip or an exe.
      # electron-builder's own sidecars -- the update manifests, the
      # blockmaps, the disk image -- are not release artifacts, and the
      # install script never asks for them.
      - name: Stage the desktop artifacts
        shell: bash
        run: |
          mkdir -p .artifacts/desktop
          staged=0
          for file in apps/desktop/out/*; do
            if [ ! -f "$file" ]; then
              continue
            fi
            case "$file" in
              *.AppImage | *.zip | *.exe)
                cp "$file" .artifacts/desktop/
                staged=$((staged + 1))
                ;;
            esac
          done
          if [ "$staged" -eq 0 ]; then
            echo "::error::package:desktop produced no release artifact under apps/desktop/out."
            echo "The artifact names are decided by scripts/build-desktop.mjs; check that it still produces them."
            exit 1
          fi
          echo "==> Staged $staged desktop artifact(s):"
          ls -1 .artifacts/desktop

      # The manifest of the artifacts this runner produced. The publisher
      # verifies every file against the merged manifest before it uploads
      # anything, so an artifact that was corrupted on the way here never
      # reaches a user.
      - name: Write the desktop checksum manifest
        shell: bash
        run: |
          (
            cd .artifacts/desktop
            for file in *; do
              if [ ! -f "$file" ] || [ "$file" = "SHA256SUMS" ]; then
                continue
              fi
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$file"
              else
                shasum -a 256 "$file"
              fi
            done > SHA256SUMS
          )

      - name: Upload the desktop part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          path: .artifacts/desktop
          if-no-files-found: error
          retention-days: 7

  # One version is one release. The parts arrive as workflow artifacts and
  # are merged here: the release tree the mirror serves is a directory per
  # version, and its checksum manifest covers every file in it.
  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-cli, build-desktop]
    steps:
      # The merge script is the private repository's: it is the one that
      # knows what a release tree is, and duplicating it here would let the
      # two drift apart.
      - name: Checkout the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xinggaoya/coda
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.CODA_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download the CLI part
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli
          path: .artifacts/parts/cli

      - name: Download the desktop parts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: .artifacts/parts/desktop

      # The merge refuses a tree it cannot vouch for: a file nobody listed,
      # a file that does not match its checksum, a file two parts produced
      # with different checksums.
      - name: Merge the release tree
        shell: bash
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          node scripts/assemble-release-tree.mjs \
            --cli=.artifacts/parts/cli \
            --desktop=.artifacts/parts/desktop \
            --version="$VERSION" \
            --output=.artifacts/release

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: xinggaoya/coda-build
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          tree=".artifacts/release/$VERSION"
          gh release create "v$VERSION" "$tree"/* \
            --repo "$RELEASE_REPOSITORY" \
            --title "Coda $VERSION" \
            --notes "Coda $VERSION: the CLI archives, the install scripts and the desktop artifacts."
          echo "==> Published v$VERSION"
